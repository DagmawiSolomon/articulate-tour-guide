<svg width="500" height="400" viewBox="0 0 500 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="gallery-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#20b8cd" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#20b8cd" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Wing Canvas Backdrop -->
  <rect x="10" y="10" width="480" height="380" rx="12" fill="#0f1013" stroke="#26272b" stroke-width="1.5" />

  <!-- North Grand Concourse -->
  <rect x="35" y="35" width="430" height="65" rx="6" fill="#141519" stroke="#26272b" stroke-width="1" />
  <text x="250" y="72" text-anchor="middle" fill="#71717a" font-size="10" font-family="system-ui, -apple-system, sans-serif" font-weight="500" letter-spacing="1">
    LEVEL 5 GRAND CONCOURSE
  </text>

  <!-- Elevators (West) -->
  <rect x="45" y="45" width="45" height="45" rx="4" fill="#1a1b20" stroke="#3f3f46" stroke-width="1" />
  <text x="67" y="72" text-anchor="middle" fill="#e4e4e7" font-size="9" font-family="system-ui, -apple-system, sans-serif" font-weight="500">
    Elevator
  </text>

  <!-- Central Impressionist Wings -->
  <!-- Gallery 34 - Manet / Degas -->
  <rect x="35" y="120" width="70" height="110" rx="6" fill="#141519" stroke="#26272b" stroke-width="1" />
  <text x="70" y="170" text-anchor="middle" fill="#a1a1aa" font-size="10" font-family="system-ui, -apple-system, sans-serif" font-weight="600">Gallery 34</text>
  <text x="70" y="185" text-anchor="middle" fill="#71717a" font-size="8" font-family="system-ui, -apple-system, sans-serif">Manet / Degas</text>

  <!-- Gallery 35 - Monet -->
  <rect x="115" y="120" width="75" height="110" rx="6" fill="#141519" stroke="#26272b" stroke-width="1" />
  <text x="152" y="170" text-anchor="middle" fill="#a1a1aa" font-size="10" font-family="system-ui, -apple-system, sans-serif" font-weight="600">Gallery 35</text>
  <text x="152" y="185" text-anchor="middle" fill="#71717a" font-size="8" font-family="system-ui, -apple-system, sans-serif">Monet Water Lilies</text>

  <!-- Gallery 36 - Van Gogh (Featured Room) -->
  <rect x="200" y="115" width="95" height="120" rx="8" fill="#18191e" stroke="#20b8cd" stroke-width="1.5" stroke-dasharray="none" />
  <rect x="200" y="115" width="95" height="120" rx="8" fill="url(#gallery-glow)" />
  <text x="247" y="160" text-anchor="middle" fill="#f4f4f5" font-size="11" font-family="system-ui, -apple-system, sans-serif" font-weight="700">Gallery 36</text>
  <text x="247" y="176" text-anchor="middle" fill="#20b8cd" font-size="9" font-family="system-ui, -apple-system, sans-serif" font-weight="500">Van Gogh</text>
  <text x="247" y="190" text-anchor="middle" fill="#a1a1aa" font-size="7.5" font-family="system-ui, -apple-system, sans-serif">Starry Night Room</text>

  <!-- Gallery 37 - Paul Gauguin -->
  <rect x="305" y="120" width="80" height="110" rx="6" fill="#141519" stroke="#26272b" stroke-width="1" />
  <text x="345" y="170" text-anchor="middle" fill="#a1a1aa" font-size="10" font-family="system-ui, -apple-system, sans-serif" font-weight="600">Gallery 37</text>
  <text x="345" y="185" text-anchor="middle" fill="#71717a" font-size="8" font-family="system-ui, -apple-system, sans-serif">Paul Gauguin</text>

  <!-- Gallery 38 - Paul Cézanne -->
  <rect x="395" y="120" width="70" height="110" rx="6" fill="#141519" stroke="#26272b" stroke-width="1" />
  <text x="430" y="170" text-anchor="middle" fill="#a1a1aa" font-size="10" font-family="system-ui, -apple-system, sans-serif" font-weight="600">Gallery 38</text>
  <text x="430" y="185" text-anchor="middle" fill="#71717a" font-size="8" font-family="system-ui, -apple-system, sans-serif">Cézanne</text>

  <!-- South Amenities Concourse -->
  <!-- Restrooms & Cloakroom -->
  <rect x="90" y="295" width="180" height="65" rx="6" fill="#141519" stroke="#26272b" stroke-width="1" />
  <text x="180" y="332" text-anchor="middle" fill="#d4d4d8" font-size="10" font-family="system-ui, -apple-system, sans-serif" font-weight="500">
    Restrooms &amp; Cloakroom
  </text>

  <!-- Café Campana -->
  <rect x="290" y="295" width="175" height="65" rx="6" fill="#141519" stroke="#26272b" stroke-width="1" />
  <text x="377" y="332" text-anchor="middle" fill="#71717a" font-size="10" font-family="system-ui, -apple-system, sans-serif" font-weight="500">
    Café Campana
  </text>
</svg>
